<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Intelligence</title>
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f4f4f5; --border: #e9e9ec; --border-strong: #d9d9de;
    --text: #0b0b0f; --text-2: #3f3f46; --muted: #8a8a94;
    --accent: #0b0b0f; --accent-text: #ffffff; --focus: #2563eb;
    --high: #16a34a; --mid: #d97706; --low: #a1a1aa;
    --error-bg: #fef2f2; --error-fg: #b91c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #09090b; --surface: #111113; --surface-2: #18181b; --border: #222226; --border-strong: #2e2e33;
      --text: #f4f4f5; --text-2: #c4c4cc; --muted: #77777f;
      --accent: #f4f4f5; --accent-text: #09090b; --focus: #60a5fa;
      --high: #4ade80; --mid: #fbbf24; --low: #71717a;
      --error-bg: #2a1214; --error-fg: #fca5a5;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #09090b; --surface: #111113; --surface-2: #18181b; --border: #222226; --border-strong: #2e2e33;
    --text: #f4f4f5; --text-2: #c4c4cc; --muted: #77777f;
    --accent: #f4f4f5; --accent-text: #09090b; --focus: #60a5fa;
    --high: #4ade80; --mid: #fbbf24; --low: #71717a;
    --error-bg: #2a1214; --error-fg: #fca5a5;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; transition: background .2s, color .2s; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid var(--border); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--text); flex-shrink: 0; position: relative; }
  .logo::after { content: ""; position: absolute; inset: 6px; border-radius: 2px; background: var(--bg); }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .actions { display: flex; align-items: center; gap: 10px; }

  .segmented { display: inline-flex; padding: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; }
  .segmented button { font: inherit; font-size: 12.5px; font-weight: 500; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 4px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .segmented button svg { width: 13px; height: 13px; }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .btn-primary { font: inherit; font-size: 13.5px; font-weight: 500; border: 0; border-radius: 999px; padding: 8px 16px; background: var(--accent); color: var(--accent-text); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: opacity .15s; white-space: nowrap; }
  .btn-primary:hover:not(:disabled) { opacity: .85; }
  .btn-primary:disabled { opacity: .6; cursor: progress; }
  .spinner { width: 12px; height: 12px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: none; }
  .btn-primary.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .intro { padding: 44px 0 20px; }
  .intro h2 { margin: 0 0 6px; font-size: 30px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.2; }
  .intro p { margin: 0; color: var(--muted); font-size: 14.5px; }
  #lastRefreshed { color: var(--muted); }

  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 4px 0 8px; }
  .select { position: relative; }
  .select::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  select { appearance: none; -webkit-appearance: none; font: inherit; font-size: 13.5px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 7px 32px 7px 14px; cursor: pointer; transition: border-color .15s; }
  select:hover { border-color: var(--border-strong); }
  #count { margin-left: auto; color: var(--muted); font-size: 13px; }

  .banner { margin: 16px 0 0; padding: 12px 16px; border-radius: 12px; font-size: 14px; display: none; }
  .banner.show { display: block; }
  .banner.info { background: var(--surface); border: 1px solid var(--border); color: var(--text-2); }
  .banner.error { background: var(--error-bg); color: var(--error-fg); }

  .progress { margin: 16px 0 0; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); display: none; }
  .progress.show { display: block; }
  .progress-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 500; font-size: 14px; margin-bottom: 12px; }
  .progress-head span { color: var(--muted); font-weight: 400; font-size: 13px; font-variant-numeric: tabular-nums; }
  .bar { height: 3px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .bar div { height: 100%; width: 0; background: var(--text); border-radius: 999px; transition: width .5s ease; }
  .rows { display: grid; gap: 14px; }
  .row { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; }
  .row .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 8px; background: var(--text); animation: pulse 1.2s ease-in-out infinite; }
  .row.done .dot { background: var(--high); animation: none; }
  .row.error .dot { background: var(--error-fg); animation: none; }
  @keyframes pulse { 50% { opacity: .25; } }
  .row > div:last-child { min-width: 0; }
  .row .name { font-weight: 500; font-size: 14px; }
  .row .stage { font-size: 13.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .stats { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  main { padding: 0 0 72px; }
  section { margin-top: 36px; }
  section h2 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  section h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  section h2 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, transform .15s, box-shadow .15s; }
  .card:hover { border-color: var(--border-strong); box-shadow: var(--shadow); transform: translateY(-1px); }
  .meta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); min-width: 0; }
  .meta .source { font-weight: 500; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta > span:nth-child(2), .meta > span:nth-child(3) { flex-shrink: 0; }
  .badge { margin-left: auto; flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--low); }
  .badge.high::before { background: var(--high); }
  .badge.mid::before { background: var(--mid); }
  .card h3 { margin: 0; font-size: 15.5px; font-weight: 600; line-height: 1.4; letter-spacing: -0.01em; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .card p { margin: 0; color: var(--text-2); font-size: 14px; line-height: 1.6; }
  .empty { color: var(--muted); padding: 64px 0; text-align: center; }

  @media (max-width: 640px) {
    .top { height: auto; padding: 12px 0; flex-wrap: wrap; }
    .segmented button span { display: none; }
    .intro { padding-top: 28px; }
    .intro h2 { font-size: 24px; }
    #count { margin-left: 0; width: 100%; }
    .grid { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand"><div class="logo" aria-hidden="true"></div><h1>News Intelligence</h1></div>
    <div class="actions">
      <div class="segmented" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" aria-pressed="false" title="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span></button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Dark</span></button>
        <button type="button" data-theme-choice="auto" aria-pressed="false" title="Auto (follows your system)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg><span>Auto</span></button>
      </div>
      <button id="refreshBtn" class="btn-primary" type="button"><span class="spinner"></span><span class="label">Refresh</span></button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="intro">
    <h2>Today’s signal in AI and markets</h2>
    <p>AI &amp; capital markets · VC into AI in finance · AI in high-speed trading · <span id="lastRefreshed">Loading…</span></p>
  </div>
  <div class="filters">
    <div class="select"><select id="topic" aria-label="Topic"><option value="">All topics</option></select></div>
    <div class="select"><select id="minScore" aria-label="Minimum relevance">
      <option value="1">Any relevance</option><option value="5">Relevance 5+</option><option value="7">Relevance 7+</option><option value="8">Relevance 8+</option><option value="9">Relevance 9+</option>
    </select></div>
    <div class="select"><select id="limit" aria-label="Number of articles">
      <option value="10">10 articles</option><option value="25">25 articles</option><option value="50" selected>50 articles</option><option value="100">100 articles</option>
    </select></div>
    <div id="count"></div>
  </div>
  <div id="progress" class="progress" aria-live="polite">
    <div class="progress-head">Agent is gathering news <span id="progressMeta"></span></div>
    <div class="bar"><div id="progressBar"></div></div>
    <div class="rows" id="progressRows"></div>
  </div>
  <div id="banner" class="banner"></div>
  <main id="content"></main>
</div>

<script>
  const API = "https://news-app-backend.sertac-karaman-ef0.workers.dev";
  const TOPICS = ["AI & capital markets", "Venture capital into AI in finance", "AI in high-speed trading"];

  const $ = (id) => document.getElementById(id);
  const topicSel = $("topic"), minScoreSel = $("minScore"), limitSel = $("limit");
  const content = $("content"), banner = $("banner"), countEl = $("count"), refreshBtn = $("refreshBtn");

  for (const t of TOPICS) topicSel.add(new Option(t, t));

  // ---------- theme: light / dark / auto (follows system) ----------
  function applyTheme(choice) {
    if (choice === "light" || choice === "dark") document.documentElement.dataset.theme = choice;
    else delete document.documentElement.dataset.theme;
    for (const b of document.querySelectorAll("[data-theme-choice]")) b.setAttribute("aria-pressed", String(b.dataset.themeChoice === choice));
    try { choice === "auto" ? localStorage.removeItem("theme") : localStorage.setItem("theme", choice); } catch {}
  }
  for (const b of document.querySelectorAll("[data-theme-choice]")) b.addEventListener("click", () => applyTheme(b.dataset.themeChoice));
  applyTheme(document.documentElement.dataset.theme || "auto");

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function safeUrl(u) {
    return /^https?:\/\//i.test(u || "") ? u : "#";
  }
  function fmtDate(d) {
    if (!d) return "Date unknown";
    const date = new Date(d.length === 10 ? d + "T12:00:00" : d);
    return isNaN(date) ? d : date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  function fmtDateTime(d) {
    // D1 stores UTC as "YYYY-MM-DD HH:MM:SS"
    const date = new Date(d.includes("T") ? d : d.replace(" ", "T") + "Z");
    return date.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }
  function scoreClass(s) { return s >= 8 ? "high" : s >= 5 ? "mid" : "low"; }

  function showBanner(text, kind) {
    banner.className = "banner show " + kind;
    banner.textContent = text;
  }
  function hideBanner() { banner.className = "banner"; }

  function render(articles) {
    countEl.textContent = `${articles.length} article${articles.length === 1 ? "" : "s"}`;
    if (!articles.length) {
      content.innerHTML = `<div class="empty">No articles match these filters.</div>`;
      return;
    }
    const groups = new Map();
    for (const t of TOPICS) groups.set(t, []);
    for (const a of articles) {
      if (!groups.has(a.topic)) groups.set(a.topic, []);
      groups.get(a.topic).push(a);
    }
    let html = "";
    for (const [topic, items] of groups) {
      if (!items.length) continue;
      html += `<section><h2>${esc(topic)} <span>${items.length}</span></h2><div class="grid">`;
      for (const a of items) {
        html += `<article class="card">
          <div class="meta"><span class="source">${esc(a.source || "Unknown source")}</span><span>·</span><span>${esc(fmtDate(a.published_at))}</span>
            <span class="badge ${scoreClass(a.relevance_score)}" title="Relevance score">${esc(a.relevance_score)}/10</span></div>
          <h3><a href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">${esc(a.headline)}</a></h3>
          <p>${esc(a.ai_summary || "")}</p>
        </article>`;
      }
      html += `</div></section>`;
    }
    content.innerHTML = html;
  }

  let loadSeq = 0;
  async function loadArticles() {
    const seq = ++loadSeq;
    const params = new URLSearchParams({ min_score: minScoreSel.value, limit: limitSel.value });
    if (topicSel.value) params.set("topic", topicSel.value);
    try {
      const res = await fetch(`${API}/articles?${params}`);
      if (!res.ok) throw new Error(`API returned ${res.status}`);
      const data = await res.json();
      if (seq !== loadSeq) return; // a newer filter change has already taken over
      render(data.articles);
      const latest = data.articles.map((a) => a.fetched_at).filter(Boolean).sort().pop();
      $("lastRefreshed").innerHTML = latest
        ? `Updated ${esc(fmtDateTime(latest))}`
        : "No data yet";
    } catch (err) {
      showBanner(`Couldn't load articles: ${err.message}`, "error");
    }
  }

  // ---------- live agent progress ----------
  const PER_TOPIC = 5, MAX_SEARCHES = 8;
  const progressEl = $("progress"), progressRows = $("progressRows"), progressBar = $("progressBar"), progressMeta = $("progressMeta");
  let topicState = new Map();

  function stageText(p) {
    switch (p.stage) {
      case "starting": return "Starting…";
      case "searching": return p.query ? `Searching the web: “${p.query}”` : "Searching the web…";
      case "checking": return "Checking sources for dates and relevance";
      case "selecting": return "Choosing the most significant articles";
      case "writing": return `Writing summaries ${p.summaries}/${PER_TOPIC}`;
      case "saving": return "Saving to the database";
      case "done": return `Done: ${p.inserted} new, ${p.skipped} already stored`;
      case "error": return "Failed: " + (p.error || "unknown error");
    }
    return p.stage;
  }
  // Rough share of a topic's work each stage represents, for the overall bar only.
  function topicPercent(p) {
    switch (p.stage) {
      case "starting": return 2;
      case "searching": case "checking": return 5 + 50 * Math.min(p.searches, MAX_SEARCHES) / MAX_SEARCHES;
      case "selecting": return 60 + 5 * Math.min(p.searches, MAX_SEARCHES) / MAX_SEARCHES;
      case "writing": return 70 + 25 * p.summaries / PER_TOPIC;
      case "saving": return 97;
      default: return 100;
    }
  }
  function renderProgress() {
    let html = "", total = 0;
    for (const t of TOPICS) {
      const p = topicState.get(t) || { stage: "starting", searches: 0, sources: 0, summaries: 0 };
      p.pct = Math.max(p.pct || 0, topicPercent(p)); // never move backwards
      total += p.pct;
      const cls = p.stage === "done" ? "done" : p.stage === "error" ? "error" : "";
      html += `<div class="row ${cls}"><div class="dot"></div><div>
        <div class="name">${esc(t)}</div>
        <div class="stage">${esc(stageText(p))}</div>
        <div class="stats">${p.searches} search${p.searches === 1 ? "" : "es"} · ${p.sources} sources found · ${p.summaries}/${PER_TOPIC} summaries</div>
      </div></div>`;
    }
    progressRows.innerHTML = html;
    progressBar.style.width = (total / TOPICS.length).toFixed(1) + "%";
  }

  async function refresh() {
    refreshBtn.disabled = true;
    refreshBtn.classList.add("loading");
    refreshBtn.querySelector(".label").textContent = "Running agent…";
    hideBanner();
    topicState = new Map();
    renderProgress();
    progressEl.classList.add("show");
    const started = Date.now();
    const timer = setInterval(() => (progressMeta.textContent = `${Math.round((Date.now() - started) / 1000)}s`), 1000);
    progressMeta.textContent = "0s";

    try {
      const res = await fetch(`${API}/agent?stream=1`, { method: "POST" });
      if (!res.ok || !res.body) throw new Error(`Agent returned ${res.status}`);
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = "", summary = null;
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;
          const ev = JSON.parse(line);
          if (ev.type === "progress") {
            const prev = topicState.get(ev.topic);
            topicState.set(ev.topic, { ...ev, pct: prev?.pct });
            renderProgress();
          } else if (ev.type === "done") summary = ev.summary;
          else if (ev.type === "error") throw new Error(ev.error);
        }
      }
      if (!summary) throw new Error("the connection closed before the agent finished");
      await loadArticles();
      progressEl.classList.remove("show");
      const secs = Math.round((Date.now() - started) / 1000);
      showBanner(`Refresh complete in ${secs}s: ${summary.inserted} new article${summary.inserted === 1 ? "" : "s"} added, ${summary.skipped} already stored (${summary.total_returned} found).`, "info");
    } catch (err) {
      progressEl.classList.remove("show");
      showBanner(`Refresh failed: ${err.message}. Any topics that had already finished were saved; reload to check.`, "error");
    } finally {
      clearInterval(timer);
      refreshBtn.disabled = false;
      refreshBtn.classList.remove("loading");
      refreshBtn.querySelector(".label").textContent = "Refresh";
    }
  }

  topicSel.addEventListener("change", loadArticles);
  minScoreSel.addEventListener("change", loadArticles);
  limitSel.addEventListener("change", loadArticles);
  refreshBtn.addEventListener("click", refresh);
  loadArticles();
</script>
</body>
</html>
